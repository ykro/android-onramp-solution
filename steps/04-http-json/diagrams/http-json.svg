<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="hj-title hj-desc">
  <title id="hj-title">Flujo HTTP con MockWebServer y JSON tolerante</title>
  <desc id="hj-desc">Cómo BookApiClient consume respuestas locales de MockWebServer y clasifica éxito, HttpError y ParseError.</desc>
  <defs>
    <marker id="arr-hj" markerWidth="9" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 9 3, 0 6" fill="#2563EB"/>
    </marker>
  </defs>

  <rect width="960" height="360" rx="12" fill="#F8F7F4"/>

  <text x="32" y="40" fill="#0F2547" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="19" font-weight="700">Paso 4 — Cliente HTTP y JSON tolerante contra MockWebServer</text>
  <text x="32" y="62" fill="#475569" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13">Prueba respuestas 200 con campos extra, errores 500 y JSON dañado en milisegundos sin internet</text>

  <!-- Caja izquierda: MockWebServer -->
  <rect x="32" y="96" width="248" height="224" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
  <rect x="48" y="112" width="150" height="22" rx="4" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="1"/>
  <text x="123" y="127" fill="#1D4ED8" font-family="ui-monospace, SFMono-Regular, monospace" font-size="11" font-weight="700" text-anchor="middle">MOCKWEBSERVER</text>
  <text x="48" y="156" fill="#0F2547" font-family="ui-monospace, SFMono-Regular, monospace" font-size="12" font-weight="600">GET /books</text>
  <rect x="48" y="170" width="216" height="40" rx="6" fill="#F0FDF4" stroke="#86EFAC" stroke-width="1"/>
  <text x="58" y="194" fill="#166534" font-family="ui-monospace, SFMono-Regular, monospace" font-size="11">200 + campos extra (isbn)</text>
  <rect x="48" y="218" width="216" height="40" rx="6" fill="#FEF2F2" stroke="#FCA5A5" stroke-width="1"/>
  <text x="58" y="242" fill="#B91C1C" font-family="ui-monospace, SFMono-Regular, monospace" font-size="11">500 fallo interno</text>
  <rect x="48" y="266" width="216" height="40" rx="6" fill="#FFF7ED" stroke="#FDBA74" stroke-width="1"/>
  <text x="58" y="290" fill="#9A3412" font-family="ui-monospace, SFMono-Regular, monospace" font-size="11">200 + {"id":"no-es-num"}</text>

  <line x1="280" y1="208" x2="334" y2="208" stroke="#2563EB" stroke-width="2" marker-end="url(#arr-hj)"/>

  <!-- Caja central: BookApiClient -->
  <rect x="338" y="96" width="286" height="224" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
  <rect x="354" y="112" width="140" height="22" rx="4" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="1"/>
  <text x="424" y="127" fill="#1D4ED8" font-family="ui-monospace, SFMono-Regular, monospace" font-size="11" font-weight="700" text-anchor="middle">BOOKAPICLIENT</text>
  <text x="354" y="158" fill="#0F2547" font-family="ui-monospace, SFMono-Regular, monospace" font-size="11.5" font-weight="600">Json que tolera campos nuevos</text>
  <text x="354" y="186" fill="#334155" font-family="system-ui, -apple-system, sans-serif" font-size="12.5">1. Ejecuta GET con OkHttp</text>
  <text x="354" y="210" fill="#334155" font-family="system-ui, -apple-system, sans-serif" font-size="12.5">2. Revisa response.isSuccessful</text>
  <text x="354" y="234" fill="#334155" font-family="system-ui, -apple-system, sans-serif" font-size="12.5">3. Decodifica List&lt;BookDto&gt;</text>
  <text x="354" y="258" fill="#334155" font-family="system-ui, -apple-system, sans-serif" font-size="12.5">4. Atrapa SerializationException</text>
  <rect x="354" y="274" width="254" height="32" rx="6" fill="#F1F5F9"/>
  <text x="481" y="294" fill="#0F2547" font-family="ui-monospace, SFMono-Regular, monospace" font-size="11" text-anchor="middle">Devuelve sealed interface ApiResult</text>

  <line x1="624" y1="208" x2="678" y2="208" stroke="#2563EB" stroke-width="2" marker-end="url(#arr-hj)"/>

  <!-- Caja derecha: ApiResult -->
  <rect x="682" y="96" width="246" height="224" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
  <rect x="698" y="112" width="120" height="22" rx="4" fill="#F0FDF4" stroke="#86EFAC" stroke-width="1"/>
  <text x="758" y="127" fill="#15803D" font-family="ui-monospace, SFMono-Regular, monospace" font-size="11" font-weight="700" text-anchor="middle">APIRESULT</text>

  <rect x="698" y="150" width="214" height="46" rx="6" fill="#ECFDF5" stroke="#86EFAC" stroke-width="1"/>
  <text x="710" y="170" fill="#15803D" font-family="ui-monospace, SFMono-Regular, monospace" font-size="11.5" font-weight="700">Success(books)</text>
  <text x="710" y="187" fill="#166534" font-family="system-ui, -apple-system, sans-serif" font-size="11.5">Ignora campos extra del servidor</text>

  <rect x="698" y="206" width="214" height="46" rx="6" fill="#FEF2F2" stroke="#FCA5A5" stroke-width="1"/>
  <text x="710" y="226" fill="#B91C1C" font-family="ui-monospace, SFMono-Regular, monospace" font-size="11.5" font-weight="700">HttpError(500)</text>
  <text x="710" y="243" fill="#7F1D1D" font-family="system-ui, -apple-system, sans-serif" font-size="11.5">Código HTTP fuera de 200..299</text>

  <rect x="698" y="262" width="214" height="46" rx="6" fill="#FFF7ED" stroke="#FDBA74" stroke-width="1"/>
  <text x="710" y="282" fill="#9A3412" font-family="ui-monospace, SFMono-Regular, monospace" font-size="11.5" font-weight="700">ParseError</text>
  <text x="710" y="299" fill="#7C2D12" font-family="system-ui, -apple-system, sans-serif" font-size="11.5">Cuerpo JSON roto o tipo inválido</text>
</svg>
