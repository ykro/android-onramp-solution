<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="sql-title sql-desc">
  <title id="sql-title">SQLite ON CONFLICT DO UPDATE frente a INSERT OR REPLACE</title>
  <desc id="sql-desc">Por qué INSERT OR REPLACE borra favorite y local_note al sincronizar con la API, mientras ON CONFLICT DO UPDATE actualiza solo title y author y conserva los datos locales.</desc>

  <rect width="960" height="400" rx="12" fill="#F8F7F4"/>

  <text x="32" y="40" fill="#0F2547" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="19" font-weight="700">Paso 4 — SQLite: sincronizar sin borrar favoritos ni notas locales</text>
  <text x="32" y="62" fill="#475569" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13">Misma base de esquema, consultas y actualización parcial que usarás en Room 3</text>

  <!-- Fila superior: Estado actual en SQLite -->
  <rect x="32" y="84" width="896" height="74" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
  <text x="48" y="108" fill="#1D4ED8" font-family="ui-monospace, SFMono-Regular, monospace" font-size="11" font-weight="700">FILA GUARDADA EN TABLA books ANTES DE SINCRONIZAR</text>
  <text x="48" y="136" fill="#0F2547" font-family="ui-monospace, SFMono-Regular, monospace" font-size="12.5">id = 1  |  title = "Kotlin Basics"  |  author = "Ana López"  |  favorite = 1  |  local_note = "Mi libro favorito"</text>

  <!-- Panel Izquierdo: INSERT OR REPLACE -->
  <rect x="32" y="178" width="436" height="196" rx="10" fill="#FFFFFF" stroke="#FECACA" stroke-width="1.5"/>
  <rect x="48" y="194" width="186" height="22" rx="4" fill="#FEF2F2" stroke="#FCA5A5" stroke-width="1"/>
  <text x="141" y="209" fill="#B91C1C" font-family="ui-monospace, SFMono-Regular, monospace" font-size="11" font-weight="700" text-anchor="middle">ERROR: INSERT OR REPLACE</text>

  <text x="48" y="238" fill="#334155" font-family="system-ui, -apple-system, sans-serif" font-size="12.5">Elimina la fila vieja e inserta una nueva con defaults:</text>
  <rect x="48" y="252" width="404" height="58" rx="6" fill="#FEF2F2" stroke="#FCA5A5" stroke-width="1"/>
  <text x="60" y="274" fill="#7F1D1D" font-family="ui-monospace, SFMono-Regular, monospace" font-size="11.5">id=1 | "Kotlin Moderno" | "Ana López"</text>
  <text x="60" y="295" fill="#B91C1C" font-family="ui-monospace, SFMono-Regular, monospace" font-size="11.5" font-weight="700">favorite = 0 (BORRADO) | local_note = "" (BORRADA)</text>
  <text x="48" y="344" fill="#B91C1C" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="600">El usuario pierde sus favoritos cada vez que llega la API.</text>

  <!-- Panel Derecho: ON CONFLICT DO UPDATE -->
  <rect x="492" y="178" width="436" height="196" rx="10" fill="#FFFFFF" stroke="#BBF7D0" stroke-width="1.5"/>
  <rect x="508" y="194" width="248" height="22" rx="4" fill="#ECFDF5" stroke="#86EFAC" stroke-width="1"/>
  <text x="632" y="209" fill="#15803D" font-family="ui-monospace, SFMono-Regular, monospace" font-size="11" font-weight="700" text-anchor="middle">CORRECTO: ON CONFLICT DO UPDATE</text>

  <text x="508" y="238" fill="#334155" font-family="system-ui, -apple-system, sans-serif" font-size="12.5">Actualiza solo title y author y conserva las columnas locales:</text>
  <rect x="508" y="252" width="404" height="58" rx="6" fill="#ECFDF5" stroke="#86EFAC" stroke-width="1"/>
  <text x="520" y="274" fill="#14532D" font-family="ui-monospace, SFMono-Regular, monospace" font-size="11.5">id=1 | "Kotlin Moderno" | "Ana López"</text>
  <text x="520" y="295" fill="#15803D" font-family="ui-monospace, SFMono-Regular, monospace" font-size="11.5" font-weight="700">favorite = 1 (INTACTO) | local_note = "Mi libro favorito"</text>
  <text x="508" y="344" fill="#15803D" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="600">Los datos locales sobreviven y se traducen directo a Room 3.</text>
</svg>
