<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 410" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="test-title test-desc">
  <title id="test-title">Ciclo Arrange, Act y Assert con detección de errores en JUnit</title>
  <desc id="test-desc">Diagrama en dos partes: arriba el flujo Arrange, Act y Assert; abajo la comparación entre rojo ante una versión con un bug y verde ante la función correcta computeReadingStreak.</desc>
  <defs>
    <marker id="arr-blue" markerWidth="10" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#1D4ED8"/>
    </marker>
  </defs>

  <rect width="960" height="410" rx="12" fill="#F8F7F4"/>

  <text x="32" y="40" fill="#0F2547" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="19" font-weight="700">Paso 5 — Pruebas automatizadas: Arrange → Act → Assert</text>
  <text x="32" y="62" fill="#475569" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13">Una prueba confiable falla en rojo ante un error real y pasa en verde cuando el código cumple el contrato</text>

  <!-- Fila superior: Arrange -> Act -> Assert -->
  <rect x="32" y="84" width="276" height="114" rx="10" fill="#FFFFFF" stroke="#BFDBFE" stroke-width="1.5"/>
  <rect x="48" y="98" width="94" height="22" rx="4" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="1"/>
  <text x="95" y="113" fill="#1D4ED8" font-family="ui-monospace, SFMono-Regular, monospace" font-size="11" font-weight="700" text-anchor="middle">1. ARRANGE</text>
  <text x="48" y="142" fill="#0F2547" font-family="system-ui, -apple-system, sans-serif" font-size="13.5" font-weight="700">Prepara los datos de entrada</text>
  <text x="48" y="164" fill="#334155" font-family="ui-monospace, SFMono-Regular, monospace" font-size="11.5">val days = listOf(10, 20, 0, 5)</text>
  <text x="48" y="182" fill="#64748B" font-family="system-ui, -apple-system, sans-serif" font-size="11.5">Incluye casos normales y bordes</text>

  <line x1="308" y1="141" x2="340" y2="141" stroke="#1D4ED8" stroke-width="2" marker-end="url(#arr-blue)"/>

  <rect x="342" y="84" width="276" height="114" rx="10" fill="#FFFFFF" stroke="#BFDBFE" stroke-width="1.5"/>
  <rect x="358" y="98" width="76" height="22" rx="4" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="1"/>
  <text x="396" y="113" fill="#1D4ED8" font-family="ui-monospace, SFMono-Regular, monospace" font-size="11" font-weight="700" text-anchor="middle">2. ACT</text>
  <text x="358" y="142" fill="#0F2547" font-family="system-ui, -apple-system, sans-serif" font-size="13.5" font-weight="700">Ejecuta la función a probar</text>
  <text x="358" y="164" fill="#334155" font-family="ui-monospace, SFMono-Regular, monospace" font-size="11.5">val res = computeReadingStreak(days)</text>
  <text x="358" y="182" fill="#64748B" font-family="system-ui, -apple-system, sans-serif" font-size="11.5">Con Flow usa runTest + Turbine</text>

  <line x1="618" y1="141" x2="650" y2="141" stroke="#1D4ED8" stroke-width="2" marker-end="url(#arr-blue)"/>

  <rect x="652" y="84" width="276" height="114" rx="10" fill="#FFFFFF" stroke="#BFDBFE" stroke-width="1.5"/>
  <rect x="668" y="98" width="90" height="22" rx="4" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="1"/>
  <text x="713" y="113" fill="#1D4ED8" font-family="ui-monospace, SFMono-Regular, monospace" font-size="11" font-weight="700" text-anchor="middle">3. ASSERT</text>
  <text x="668" y="142" fill="#0F2547" font-family="system-ui, -apple-system, sans-serif" font-size="13.5" font-weight="700">Comprueba el resultado</text>
  <text x="668" y="164" fill="#334155" font-family="ui-monospace, SFMono-Regular, monospace" font-size="11.5">assertEquals(2, res)</text>
  <text x="668" y="182" fill="#64748B" font-family="system-ui, -apple-system, sans-serif" font-size="11.5">Verifica el valor esperado exacto</text>

  <!-- Fila inferior: Rojo ante bug vs Verde ante código sano -->
  <rect x="32" y="220" width="436" height="162" rx="10" fill="#FFFFFF" stroke="#FECACA" stroke-width="1.5"/>
  <rect x="48" y="236" width="198" height="24" rx="4" fill="#FEF2F2" stroke="#FCA5A5" stroke-width="1"/>
  <text x="147" y="252" fill="#B91C1C" font-family="ui-monospace, SFMono-Regular, monospace" font-size="11" font-weight="700" text-anchor="middle">ROJO: VERSIÓN CON UN BUG</text>
  <text x="48" y="284" fill="#0F2547" font-family="ui-monospace, SFMono-Regular, monospace" font-size="12">Versión con un bug ([10, 20, 0, 5])</text>
  <text x="48" y="308" fill="#7F1D1D" font-family="system-ui, -apple-system, sans-serif" font-size="12.5">No reinicia el conteo en 0 → devuelve 3 en lugar de 2.</text>
  <rect x="48" y="326" width="404" height="38" rx="6" fill="#FEF2F2" stroke="#FCA5A5" stroke-width="1"/>
  <text x="250" y="350" fill="#B91C1C" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" text-anchor="middle">AssertionError: expected:&lt;2&gt; but was:&lt;3&gt; (bug detectado)</text>

  <rect x="492" y="220" width="436" height="162" rx="10" fill="#FFFFFF" stroke="#BBF7D0" stroke-width="1.5"/>
  <rect x="508" y="236" width="194" height="24" rx="4" fill="#ECFDF5" stroke="#86EFAC" stroke-width="1"/>
  <text x="605" y="252" fill="#15803D" font-family="ui-monospace, SFMono-Regular, monospace" font-size="11" font-weight="700" text-anchor="middle">VERDE: FUNCIÓN CORRECTA</text>
  <text x="508" y="284" fill="#0F2547" font-family="ui-monospace, SFMono-Regular, monospace" font-size="12">computeReadingStreak([10, 20, 0, 5])</text>
  <text x="508" y="308" fill="#166534" font-family="system-ui, -apple-system, sans-serif" font-size="12.5">Reinicia el conteo en 0 → devuelve la racha real de 2.</text>
  <rect x="508" y="326" width="404" height="38" rx="6" fill="#ECFDF5" stroke="#86EFAC" stroke-width="1"/>
  <text x="710" y="350" fill="#15803D" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" text-anchor="middle">PASS: assertEquals(2, 2) confirma el comportamiento</text>
</svg>
