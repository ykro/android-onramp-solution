<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1040 370" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="overview-title overview-desc">
  <title id="overview-title">Mapa general de Android On-Ramp (5 pasos independientes)</title>
  <desc id="overview-desc">Cinco pasos independientes antes de android-course: Paso 1 Entorno, Paso 2 Kotlin y StateFlow, Paso 3 Corrutinas y UI, Paso 4 HTTP y JSON, y Paso 5 SQLite y Room.</desc>
  <defs>
    <marker id="arrow-green" markerWidth="10" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#15803D"/>
    </marker>
  </defs>

  <rect width="1040" height="370" rx="12" fill="#F8F7F4"/>

  <text x="28" y="40" fill="#0F2547" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="20" font-weight="700">Android On-Ramp — 5 pasos independientes (60 minutos)</text>
  <text x="28" y="62" fill="#475569" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13">Empieza por el paso que necesites reforzar y verifica cada uno por separado sin emulador ni internet</text>

  <!-- Paso 1 -->
  <rect x="28" y="88" width="184" height="190" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
  <rect x="42" y="102" width="58" height="22" rx="4" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="1"/>
  <text x="71" y="117" fill="#1D4ED8" font-family="ui-monospace, SFMono-Regular, monospace" font-size="11" font-weight="700" text-anchor="middle">PASO 1</text>
  <text x="156" y="117" fill="#64748B" font-family="system-ui, -apple-system, sans-serif" font-size="11" text-anchor="end">10 min</text>
  <text x="42" y="148" fill="#0F2547" font-family="system-ui, -apple-system, sans-serif" font-size="14.5" font-weight="700">Entorno</text>
  <text x="42" y="172" fill="#334155" font-family="system-ui, -apple-system, sans-serif" font-size="12">• JDK 21 (Temurin)</text>
  <text x="42" y="192" fill="#334155" font-family="system-ui, -apple-system, sans-serif" font-size="12">• ANDROID_HOME</text>
  <text x="42" y="212" fill="#334155" font-family="system-ui, -apple-system, sans-serif" font-size="12">• Plataformas SDK</text>
  <rect x="42" y="240" width="156" height="24" rx="5" fill="#F1F5F9"/>
  <text x="120" y="256" fill="#0F2547" font-family="ui-monospace, SFMono-Regular, monospace" font-size="11" text-anchor="middle">./gradlew paso1</text>

  <!-- Paso 2 -->
  <rect x="228" y="88" width="184" height="190" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
  <rect x="242" y="102" width="58" height="22" rx="4" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="1"/>
  <text x="271" y="117" fill="#1D4ED8" font-family="ui-monospace, SFMono-Regular, monospace" font-size="11" font-weight="700" text-anchor="middle">PASO 2</text>
  <text x="356" y="117" fill="#64748B" font-family="system-ui, -apple-system, sans-serif" font-size="11" text-anchor="end">15 min</text>
  <text x="242" y="148" fill="#0F2547" font-family="system-ui, -apple-system, sans-serif" font-size="14.5" font-weight="700">Kotlin y StateFlow</text>
  <text x="242" y="172" fill="#334155" font-family="system-ui, -apple-system, sans-serif" font-size="12">• Bloques con receptor</text>
  <text x="242" y="192" fill="#334155" font-family="system-ui, -apple-system, sans-serif" font-size="12">• sealed interface</text>
  <text x="242" y="212" fill="#334155" font-family="system-ui, -apple-system, sans-serif" font-size="12">• copy() + StateFlow</text>
  <rect x="242" y="240" width="156" height="24" rx="5" fill="#F1F5F9"/>
  <text x="320" y="256" fill="#0F2547" font-family="ui-monospace, SFMono-Regular, monospace" font-size="11" text-anchor="middle">./gradlew paso2</text>

  <!-- Paso 3 -->
  <rect x="428" y="88" width="184" height="190" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
  <rect x="442" y="102" width="58" height="22" rx="4" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="1"/>
  <text x="471" y="117" fill="#1D4ED8" font-family="ui-monospace, SFMono-Regular, monospace" font-size="11" font-weight="700" text-anchor="middle">PASO 3</text>
  <text x="556" y="117" fill="#64748B" font-family="system-ui, -apple-system, sans-serif" font-size="11" text-anchor="end">15 min</text>
  <text x="442" y="148" fill="#0F2547" font-family="system-ui, -apple-system, sans-serif" font-size="14.5" font-weight="700">Corrutinas y UI</text>
  <text x="442" y="172" fill="#334155" font-family="system-ui, -apple-system, sans-serif" font-size="12">• delay y runTest</text>
  <text x="442" y="192" fill="#334155" font-family="system-ui, -apple-system, sans-serif" font-size="12">• CancellationException</text>
  <text x="442" y="212" fill="#334155" font-family="system-ui, -apple-system, sans-serif" font-size="12">• Memoria tipo remember</text>
  <rect x="442" y="240" width="156" height="24" rx="5" fill="#F1F5F9"/>
  <text x="520" y="256" fill="#0F2547" font-family="ui-monospace, SFMono-Regular, monospace" font-size="11" text-anchor="middle">./gradlew paso3</text>

  <!-- Paso 4 -->
  <rect x="628" y="88" width="184" height="190" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
  <rect x="642" y="102" width="58" height="22" rx="4" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="1"/>
  <text x="671" y="117" fill="#1D4ED8" font-family="ui-monospace, SFMono-Regular, monospace" font-size="11" font-weight="700" text-anchor="middle">PASO 4</text>
  <text x="756" y="117" fill="#64748B" font-family="system-ui, -apple-system, sans-serif" font-size="11" text-anchor="end">10 min</text>
  <text x="642" y="148" fill="#0F2547" font-family="system-ui, -apple-system, sans-serif" font-size="14.5" font-weight="700">HTTP y JSON</text>
  <text x="642" y="172" fill="#334155" font-family="system-ui, -apple-system, sans-serif" font-size="12">• ignoreUnknownKeys</text>
  <text x="642" y="192" fill="#334155" font-family="system-ui, -apple-system, sans-serif" font-size="12">• MockWebServer</text>
  <text x="642" y="212" fill="#334155" font-family="system-ui, -apple-system, sans-serif" font-size="12">• HttpError / ParseError</text>
  <rect x="642" y="240" width="156" height="24" rx="5" fill="#F1F5F9"/>
  <text x="720" y="256" fill="#0F2547" font-family="ui-monospace, SFMono-Regular, monospace" font-size="11" text-anchor="middle">./gradlew paso4</text>

  <!-- Paso 5 -->
  <rect x="828" y="88" width="184" height="190" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
  <rect x="842" y="102" width="58" height="22" rx="4" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="1"/>
  <text x="871" y="117" fill="#1D4ED8" font-family="ui-monospace, SFMono-Regular, monospace" font-size="11" font-weight="700" text-anchor="middle">PASO 5</text>
  <text x="956" y="117" fill="#64748B" font-family="system-ui, -apple-system, sans-serif" font-size="11" text-anchor="end">10 min</text>
  <text x="842" y="148" fill="#0F2547" font-family="system-ui, -apple-system, sans-serif" font-size="14.5" font-weight="700">SQLite y Room</text>
  <text x="842" y="172" fill="#334155" font-family="system-ui, -apple-system, sans-serif" font-size="12">• CREATE TABLE + PK</text>
  <text x="842" y="192" fill="#334155" font-family="system-ui, -apple-system, sans-serif" font-size="12">• SELECT / ORDER BY</text>
  <text x="842" y="212" fill="#334155" font-family="system-ui, -apple-system, sans-serif" font-size="12">• ON CONFLICT DO UPDATE</text>
  <rect x="842" y="240" width="156" height="24" rx="5" fill="#F1F5F9"/>
  <text x="920" y="256" fill="#0F2547" font-family="ui-monospace, SFMono-Regular, monospace" font-size="11" text-anchor="middle">./gradlew paso5</text>

  <!-- Barra final -->
  <rect x="28" y="298" width="984" height="46" rx="8" fill="#ECFDF5" stroke="#A7F3D0" stroke-width="1.5"/>
  <text x="48" y="326" fill="#166534" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600">Verificación completa:</text>
  <text x="198" y="326" fill="#14532D" font-family="ui-monospace, SFMono-Regular, monospace" font-size="12.5">./gradlew ready --no-parallel</text>
  <line x1="444" y1="321" x2="484" y2="321" stroke="#15803D" stroke-width="1.8" marker-end="url(#arrow-green)"/>
  <text x="498" y="326" fill="#166534" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600">Paso 1 al Paso 5 en verde (11/11 pruebas) → Listo para ykro/android-course</text>
</svg>
