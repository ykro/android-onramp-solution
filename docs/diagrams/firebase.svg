<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="fb-title fb-desc">
  <title id="fb-title">Arquitectura corta de Firebase Auth, Firestore con callbackFlow y firestore.rules</title>
  <desc id="fb-desc">Flujo desde Firebase Auth que entrega el uid verificado, pasando por firestore.rules en el servidor que autorizan lectura y escritura, hasta Cloud Firestore que envía cambios en vivo mediante addSnapshotListener envuelto en callbackFlow hacia StateFlow y Compose.</desc>
  <defs>
    <marker id="arr-slate" markerWidth="10" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#1D4ED8"/>
    </marker>
    <marker id="arr-emerald" markerWidth="10" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#15803D"/>
    </marker>
  </defs>

  <rect width="960" height="360" rx="12" fill="#F8F7F4"/>

  <text x="32" y="40" fill="#0F2547" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="19" font-weight="700">Firebase en Android — Auth, firestore.rules y Firestore en vivo</text>
  <text x="32" y="62" fill="#475569" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13">Cómo se conectan la identidad del usuario, la autorización en servidor y los datos reactivos con callbackFlow</text>

  <!-- Bloque 1: Firebase Auth -->
  <rect x="32" y="88" width="204" height="176" rx="10" fill="#FFFFFF" stroke="#BFDBFE" stroke-width="1.5"/>
  <rect x="46" y="102" width="114" height="22" rx="4" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="1"/>
  <text x="103" y="117" fill="#1D4ED8" font-family="ui-monospace, SFMono-Regular, monospace" font-size="11" font-weight="700" text-anchor="middle">1. FIREBASE AUTH</text>
  <text x="46" y="148" fill="#0F2547" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700">Identidad verificada</text>
  <text x="46" y="172" fill="#334155" font-family="system-ui, -apple-system, sans-serif" font-size="12">Inicia sesión y entrega</text>
  <text x="46" y="190" fill="#334155" font-family="system-ui, -apple-system, sans-serif" font-size="12">un token firmado.</text>
  <rect x="46" y="214" width="176" height="34" rx="5" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>
  <text x="134" y="235" fill="#0F2547" font-family="ui-monospace, SFMono-Regular, monospace" font-size="11" text-anchor="middle">request.auth.uid</text>

  <line x1="236" y1="176" x2="268" y2="176" stroke="#1D4ED8" stroke-width="2" marker-end="url(#arr-slate)"/>

  <!-- Bloque 2: firestore.rules -->
  <rect x="270" y="88" width="208" height="176" rx="10" fill="#FFFFFF" stroke="#FDBA74" stroke-width="1.5"/>
  <rect x="284" y="102" width="136" height="22" rx="4" fill="#FFF7ED" stroke="#FDBA74" stroke-width="1"/>
  <text x="352" y="117" fill="#9A3412" font-family="ui-monospace, SFMono-Regular, monospace" font-size="11" font-weight="700" text-anchor="middle">2. FIRESTORE.RULES</text>
  <text x="284" y="148" fill="#0F2547" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700">Filtro en servidor</text>
  <text x="284" y="172" fill="#334155" font-family="system-ui, -apple-system, sans-serif" font-size="12">Valida permisos antes</text>
  <text x="284" y="190" fill="#334155" font-family="system-ui, -apple-system, sans-serif" font-size="12">de leer o escribir datos.</text>
  <rect x="284" y="214" width="180" height="34" rx="5" fill="#FFF7ED" stroke="#FDBA74" stroke-width="1"/>
  <text x="374" y="235" fill="#9A3412" font-family="ui-monospace, SFMono-Regular, monospace" font-size="10.5" text-anchor="middle">auth.uid == uid</text>

  <line x1="478" y1="176" x2="510" y2="176" stroke="#1D4ED8" stroke-width="2" marker-end="url(#arr-slate)"/>

  <!-- Bloque 3: Cloud Firestore -->
  <rect x="512" y="88" width="204" height="176" rx="10" fill="#FFFFFF" stroke="#BFDBFE" stroke-width="1.5"/>
  <rect x="526" y="102" width="128" height="22" rx="4" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="1"/>
  <text x="590" y="117" fill="#1D4ED8" font-family="ui-monospace, SFMono-Regular, monospace" font-size="11" font-weight="700" text-anchor="middle">3. FIRESTORE LIVE</text>
  <text x="526" y="148" fill="#0F2547" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700">Listener en vivo</text>
  <text x="526" y="172" fill="#334155" font-family="system-ui, -apple-system, sans-serif" font-size="12">Emite snapshots cuando</text>
  <text x="526" y="190" fill="#334155" font-family="system-ui, -apple-system, sans-serif" font-size="12">cambia la colección.</text>
  <rect x="526" y="214" width="176" height="34" rx="5" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>
  <text x="614" y="235" fill="#0F2547" font-family="ui-monospace, SFMono-Regular, monospace" font-size="10.5" text-anchor="middle">addSnapshotListener</text>

  <line x1="716" y1="176" x2="748" y2="176" stroke="#15803D" stroke-width="2" marker-end="url(#arr-emerald)"/>

  <!-- Bloque 4: callbackFlow + UI -->
  <rect x="750" y="88" width="178" height="176" rx="10" fill="#FFFFFF" stroke="#BBF7D0" stroke-width="1.5"/>
  <rect x="764" y="102" width="118" height="22" rx="4" fill="#ECFDF5" stroke="#86EFAC" stroke-width="1"/>
  <text x="823" y="117" fill="#15803D" font-family="ui-monospace, SFMono-Regular, monospace" font-size="11" font-weight="700" text-anchor="middle">4. APP KOTLIN</text>
  <text x="764" y="148" fill="#0F2547" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700">callbackFlow → UI</text>
  <text x="764" y="172" fill="#334155" font-family="system-ui, -apple-system, sans-serif" font-size="12">Convierte eventos en</text>
  <text x="764" y="190" fill="#334155" font-family="system-ui, -apple-system, sans-serif" font-size="12">Flow y StateFlow.</text>
  <rect x="764" y="214" width="150" height="34" rx="5" fill="#ECFDF5" stroke="#86EFAC" stroke-width="1"/>
  <text x="839" y="235" fill="#15803D" font-family="ui-monospace, SFMono-Regular, monospace" font-size="10.5" text-anchor="middle">awaitClose { ... }</text>

  <!-- Nota inferior -->
  <rect x="32" y="286" width="896" height="48" rx="8" fill="#ECFDF5" stroke="#A7F3D0" stroke-width="1.5"/>
  <text x="52" y="315" fill="#166534" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600">Regla de oro en Unidad 3: cierra el listener dentro de awaitClose y protege cada ruta en firestore.rules.</text>
</svg>
